name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile and run checks
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:verifyRoborazziDebug --no-daemon
      - name: Upload reports and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-reports
          path: |
            app/build/reports
            app/build/outputs/roborazzi
          if-no-files-found: warn
          retention-days: 7
